# Default values for fluss.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: ""
  repository: registry.tde.sktelecom.com/emergingdp/tlake/fluss
  tag: "0.8.0-incubating-hive-iceberg-s3"
  pullPolicy: IfNotPresent
  pullSecrets: []

appConfig:
  internalPort: 9123
  externalPort: 9124


# Fluss server configuration options
# https://fluss.apache.org/docs/maintenance/configuration/
configurationOverrides:
  # Common
  default.bucket.number: 3 # 1
  default.replication.factor: 3 # 1
  bind.listeners: 0.0.0.0
  internal.listener.name: INTERNAL # FLUSS
  # Fluss uses file systems as remote storage to store snapshots for Primary-Key Table and store tiered log segments for Log Table.
  remote.data.dir: s3://tlake-ns2/fluss/remote-data
  remote.fs.write-buffer-size: 10mb # 4kb
  auto-partition.check.interval: 5min # 10min

  # Remote Storage: s3
  s3.endpoint: http://10.10.27.27:9000
  s3.access-key: minioadmin
  s3.secret-key: minioadmin
  s3.region: tlake

  # Zookeeper
  zookeeper.path.root: /fluss
  zookeeper.address: zookeeper-client.{{ .Release.Namespace }}.svc.cluster.local:2181

  # TabletServer
  data.dir: /tmp/fluss/data

  # Lakehouse Storage: iceberg
  # https://fluss.apache.org/docs/streaming-lakehouse/integrate-data-lakes/iceberg/
  datalake.format: iceberg
  datalake.iceberg.type: hive
  datalake.iceberg.warehouse: s3://tlake-ns2/warehouse/
  datalake.iceberg.uri: http://metastore.tlake.svc.cluster.local:9083
  datalake.iceberg.s3.endpoint: http://10.10.27.27:9000
  datalake.iceberg.s3.path-style-access: true
  datalake.iceberg.s3.region: tlake
  datalake.iceberg.s3.access-key-id: minioadmin
  datalake.iceberg.s3.secret-access-key: minioadmin
  datalake.iceberg.io-impl: org.apache.iceberg.aws.s3.S3FileIO

persistence:
  enabled: true
  size: 1Gi
  storageClass: rbd

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # coordinatorServer:
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  # tabletServer:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi
